plugins {
    id 'com.android.library'
}

// 两个演示 App 共用的 UI 组件：主题、消息列表、状态卡片、系统栏适配、网络监听
android {
    namespace 'com.lq.lan.ui'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    api project(':lan-core')
    api 'androidx.appcompat:appcompat:1.7.0'
    api 'androidx.activity:activity:1.8.1'
    api 'com.google.android.material:material:1.12.0'
    api 'androidx.recyclerview:recyclerview:1.3.1'
    api 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    api 'androidx.lifecycle:lifecycle-livedata:2.6.2'
    // 对齐传递依赖里新旧 kotlin-stdlib-jdk7/jdk8 的版本，避免重复类
    api platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
